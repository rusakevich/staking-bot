<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staking Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 1. ТЕМА: POLKADOT LIGHT (По умолчанию) */
        :root {
            color-scheme: light;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #6c757d;
            --text-header: #111111;
            --accent-primary: #E6007A;
            --accent-secondary: #552BBF;
            --btn-preset-bg: #f0f0f0;
            --btn-preset-text: #111111;
            --btn-chart-bg: #e0f7f7;
            --btn-chart-text: #008B8B;
            --border-color: #E6007A33;
            --grid-color: #f0f0f0;
            --axis-text: #111111;
            --font-family: 'Inter', sans-serif;
            --bar-color: #552BBF;
            --bar-border: #552BBF;
            --line-color: #E6007A;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        /* 2. ТЕМА: POLKADOT DARK */
        .theme-dark {
            color-scheme: dark;
            --bg-color: #111111;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #AAAAAA;
            --text-header: #FFFFFF;
            --accent-primary: #E6007A;
            --accent-secondary: #43AAB4; /* Cyan */
            --btn-preset-bg: #333333;
            --btn-preset-text: #FFFFFF;
            --btn-chart-bg: #2A2A2A;
            --btn-chart-text: #43AAB4;
            --border-color: #333333;
            --grid-color: #333333;
            --axis-text: #FFFFFF;
            --font-family: 'Inter', sans-serif;
            --bar-color: #43AAB4;
            --bar-border: #43AAB4;
            --line-color: #E6007A;
            --shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* 3. ТЕМА: CLASSIC (Старая) */
        .theme-classic {
            color-scheme: light;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #999;
            --text-header: #555;
            --accent-primary: #e6007a;
            --accent-secondary: #0088cc;
            --btn-preset-bg: #f1f3f5;
            --btn-preset-text: #495057;
            --btn-chart-bg: #e7f5ff;
            --btn-chart-text: #1971c2;
            --border-color: #eee;
            --grid-color: #eee;
            --axis-text: #666;
            --font-family: sans-serif;
            --bar-color: rgba(0, 136, 204, 0.6);
            --bar-border: #0088cc;
            --line-color: #e6007a;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { font-family: var(--font-family); background: var(--bg-color); color: var(--text-main); overflow-x: hidden; -webkit-overflow-scrolling: touch; width: 100%; transition: background 0.3s ease, color 0.3s ease; }
        
        #app-wrapper { width: 100%; padding: 15px; position: relative; }
        
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); position: relative; overflow: hidden; width: 100%; border: 1px solid var(--border-color); transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease; }
        
        /* Эффект бегущей змейки */
        .card.loading::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-primary) 20%, var(--accent-secondary) 40%, transparent 60%);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: snake-move 1.5s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes snake-move {
            0% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }

        input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; display: block; box-sizing: border-box; -webkit-appearance: none; background: var(--card-bg); color: var(--text-main); font-family: var(--font-family); position: relative; z-index: 2; }
        
        .btn-main { width: 100%; padding: 12px; background: var(--accent-primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; display: block; margin-bottom: 5px; font-family: var(--font-family); transition: background 0.3s ease; position: relative; z-index: 2; }
        .btn-main:disabled { background: #99ccdd; }
        
        .dates-row { width: 100%; font-size: 0; margin-bottom: 15px; position: relative; z-index: 2; }
        .date-col { display: inline-block; vertical-align: top; width: 49%; box-sizing: border-box; }
        .date-col:first-child { margin-right: 2%; }
        
        #preset-buttons, .group-bar { width: 100%; font-size: 0; margin-bottom: 5px; position: relative; z-index: 2; }
        .group-bar { margin-top: 15px; }
        
        .btn-sub { display: inline-block; vertical-align: top; width: 32%; margin-right: 2%; margin-bottom: 6px; padding: 8px 2px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; text-align: center; line-height: 1.3; box-sizing: border-box; overflow: hidden; word-break: break-word; font-family: var(--font-family); transition: background 0.3s, color 0.3s; }
        .btn-sub:nth-child(3n) { margin-right: 0; }
        
        #preset-buttons .btn-sub { background: var(--btn-preset-bg); color: var(--btn-preset-text); }
        #preset-buttons .btn-sub.active { background: var(--accent-primary); color: white; }
        
        .group-bar .btn-sub { background: var(--btn-chart-bg); color: var(--btn-chart-text); }
        .group-bar .btn-sub.active { background: var(--accent-secondary); color: white; }

        .history-group-bar { display: flex; width: 100%; gap: 4px; margin-top: 15px; margin-bottom: 15px; position: relative; z-index: 2; }
        .history-group-bar .btn-sub { flex: 1; width: auto; margin: 0; background: var(--btn-chart-bg); color: var(--btn-chart-text); font-size: 10px; padding: 6px 2px; }
        .history-group-bar .btn-sub.active { background: var(--accent-secondary); color: white; }

        h3 { font-size: 1.1em; color: var(--text-header); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; font-weight: 700; position: relative; z-index: 2; }
        
        .title-container { display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; user-select: none; }
        
        .dot-icon { 
            width: 22px; 
            height: 22px; 
            display: inline-block; 
            flex-shrink: 0; 
            object-fit: cover; 
            transition: transform 0.3s ease, opacity 0.2s ease; 
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        .title-container:hover .dot-icon { transform: rotate(180deg); }
        .title-text { flex: 1; font-weight: 700; font-size: 1.1em; }
        
        .h3-content { display: flex; align-items: center; gap: 10px; flex: 1; }
        .period-mini-label { font-size: 0.8em; font-weight: normal; color: var(--text-muted); }

        .reward-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 0.95em; position: relative; z-index: 2; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.8em; color: white; margin-right: 5px; font-weight: 600; }
        .relay { background: #e6007a; } 
        .assethub { background: #6d3aff; } 
        .slash-badge { background: #dc3545; }
        .muted { color: var(--text-muted); font-size: 0.9em; }
        .hidden { display: none !important; }
        
        .income-box { text-align: center; padding: 10px 0; position: relative; z-index: 2; }
        .income-val { font-size: 1.8em; font-weight: 800; color: var(--accent-secondary); font-family: var(--font-family); }
        .slash-val { font-size: 1.1em; font-weight: bold; color: #dc3545; margin-top: 5px; }
        .no-slash { font-size: 0.8em; color: #28a745; margin-top: 5px; }
        
        .row-cards { display: flex; gap: 15px; margin-bottom: 15px; }
        .row-cards .card { flex: 1; margin-bottom: 0; }

        .chart-container { height: 280px; width: 100%; margin-top: 15px; margin-bottom: 25px; position: relative; z-index: 1; overflow: hidden; }

        .chart-toggles { position: absolute; top: 5px; right: 5px; z-index: 10; display: flex; gap: 6px; }
        .chart-toggle-btn { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; cursor: pointer; padding: 0; box-shadow: 0 0 3px rgba(0,0,0,0.3); opacity: 1; transition: opacity 0.2s; }
        .chart-toggle-btn.inactive { opacity: 0.3; }
        
        .error { color: red; font-size: 0.9em; margin-top: 10px; text-align: center; position: relative; z-index: 2; }
        .period-label { text-align: center; font-weight: bold; color: var(--accent-primary); margin: 10px 0; font-size: 1.1em; position: relative; z-index: 2; }
        
        .progress-label { 
            text-align: center; 
            color: var(--accent-primary); 
            font-weight: bold; 
            margin-top: 5px; 
            min-height: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            z-index: 2;
        }
        
        /* НОВЫЙ ПРОГРЕСС-БАР (Два клубка) */
        .progress-bar-bg { 
            position: relative;
            width: 95%; 
            height: 10px; 
            background: var(--btn-preset-bg); 
            border-radius: 5px; 
            margin: 0 auto; 
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
            overflow: visible;
            transition: opacity 0.2s ease;
        }
        .progress-bar-fill-left { 
            position: absolute; top: 0; left: 0; height: 100%; 
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary)); 
            width: 0%; transition: width 0.4s ease; border-radius: 5px 0 0 5px; 
            box-shadow: 0 0 10px var(--accent-primary);
        }
        .progress-bar-fill-right { 
            position: absolute; top: 0; right: 0; height: 100%; 
            background: linear-gradient(270deg, var(--accent-secondary), var(--accent-primary)); 
            width: 0%; transition: width 0.4s ease; border-radius: 0 5px 5px 0; 
            box-shadow: 0 0 10px var(--accent-primary);
        }
        
        .progress-spool {
            position: absolute;
            top: -7px; 
            width: 24px;
            height: 24px;
            background-image: url('https://raw.githubusercontent.com/polkadot-js/apps/master/packages/apps/public/favicon.ico');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
            transition: left 0.4s ease, right 0.4s ease;
            z-index: 5;
        }
        .progress-spool-left {
            left: 0; /* controlled by JS */
            animation: spin-cw 1.2s linear infinite;
        }
        .progress-spool-right {
            right: 0; /* controlled by JS */
            animation: spin-ccw 1.2s linear infinite;
        }
        @keyframes spin-cw { to { transform: rotate(360deg); } }
        @keyframes spin-ccw { to { transform: rotate(-360deg); } }

        /* Мощный Салют */
        .spark {
            position: fixed;
            width: 12px; 
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            box-shadow: 0 0 15px currentColor, 0 0 5px white;
            animation: spark-fly 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes spark-fly {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            70% { opacity: 0.9; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
        }
        .firework-flash {
            position: fixed;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 0 0 60px 30px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10001;
            animation: flash-out 0.8s ease-out forwards;
        }
        @keyframes flash-out {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; }
        }

        .toggle-btn { background: var(--btn-preset-bg); color: var(--btn-preset-text); border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; cursor: pointer; font-weight: bold; flex-shrink: 0; font-family: var(--font-family); position: relative; z-index: 2; }
        
        .token-row { padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 0.95em; position: relative; z-index: 2; }
        .token-row:last-child { border-bottom: none; }

        .acc-group { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; overflow: hidden; position: relative; z-index: 2; }
        .acc-header { background: var(--bg-color); padding: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 0.95em; color: var(--text-main); }
        .acc-body { padding: 0 10px; display: block; background: var(--card-bg); }
        .acc-body.hidden { display: none; }
        .acc-arrow { transition: transform 0.2s; margin-left: 5px; }
        .acc-header.open .acc-arrow { transform: rotate(90deg); }
        .acc-diff-up { color: #28a745; font-size: 0.8em; margin-left: 5px; }
        .acc-diff-down { color: #dc3545; font-size: 0.8em; margin-left: 5px; }

        .version-tag { text-align: right; font-size: 10px; color: var(--text-muted); margin-top: 5px; position: relative; z-index: 2; }
        
        .rotate-btn { display: none; position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: rgba(108, 117, 125, 0.9); color: white; border-radius: 50%; z-index: 9999; font-size: 20px; padding: 0; text-align: center; line-height: 45px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); cursor: pointer; border: none; }

        #app-wrapper.landscape { position: fixed; top: 0; left: 0; width: 100vh; height: 100vw; transform-origin: top left; transform: rotate(90deg) translateY(-100vw); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 15px; background: var(--bg-color); z-index: 9998; }
        #app-wrapper.landscape .chart-container { height: 220px !important; margin-bottom: 30px !important; }
        #app-wrapper.landscape .row-cards { flex-direction: row !important; gap: 15px !important; } 

        @media (max-width: 768px) { 
            .rotate-btn { display: block; } 
            h3 { font-size: 1em; flex-direction: row; align-items: center; } 
            .row-cards { flex-direction: column; gap: 15px; } 
            .row-cards .card { margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <button class="rotate-btn" id="rotateBtn" onclick="toggleOrientation()">🔄</button>

    <div id="app-wrapper">
        <!-- Блок адреса получил ID addressCard -->
        <div class="card" id="addressCard">
            <h3>
                <div class="title-container" onclick="toggleTheme()">
                    <img src="https://raw.githubusercontent.com/polkadot-js/apps/master/packages/apps/public/favicon.ico" class="dot-icon" id="themeLogo" alt="DOT">
                    <span id="titleText">Адрес Polkadot</span>
                </div>
            </h3>
            <input type="text" id="address" placeholder="Вставьте ваш адрес (Polkadot / Asset Hub)">
            <!-- Кнопка передает true, так как адрес мог измениться -->
            <button class="btn-main" onclick="fetchData(true)">Загрузить данные</button>
            <div id="mainError" class="error"></div>
        </div>

        <div class="card hidden" id="configCard">
            <h3>
                <div class="h3-content">
                    <span>📅 Период анализа</span>
                    <span id="periodMiniLabel" class="period-mini-label"></span>
                </div>
                <button class="toggle-btn" onclick="toggleCard('configBody', this)">Свернуть</button>
            </h3>
            <div id="configBody">
                <div class="dates-row">
                    <div class="date-col"><label>С</label><input type="date" id="startDate" onchange="onDateChange()"></div>
                    <div class="date-col"><label>По</label><input type="date" id="endDate" onchange="onDateChange()"></div>
                </div>
                <div id="preset-buttons">
                    <button class="btn-sub" onclick="setPreset(7, this)">7 дней</button>
                    <button class="btn-sub active" onclick="setPreset(30, this)">30 дней</button>
                    <button class="btn-sub" onclick="setPreset(90, this)">90 дней</button>
                    <button class="btn-sub" onclick="setPreset(180, this)">Полгода</button>
                    <button class="btn-sub" onclick="setPreset(365, this)">Год</button>
                    <button class="btn-sub" onclick="setPreset(99999, this)">Весь период</button>
                </div>
                <div class="period-label" id="periodLabel"></div>
                <div class="progress-label" id="progressLabel"></div>
                <!-- Кнопка передает false, так как меняется только период -->
                <button class="btn-main" style="background:var(--accent-secondary)" onclick="fetchData(false)">Рассчитать</button>
                <div class="version-tag">v21.0 (Smart Loading)</div>
            </div>
        </div>

        <div class="row-cards">
            <div class="card hidden" id="stakingCard">
                <h3>💰 Стейкинг и Баланс</h3>
                <div id="stakingSummary">Загрузка...</div>
            </div>

            <div class="card hidden" id="incomeCard">
                <h3>💎 Доход</h3>
                <div id="income">Загрузка...</div>
            </div>
        </div>

        <div class="card hidden" id="chartCard">
            <h3>📊 График доходов <button class="toggle-btn" onclick="toggleCard('chartBody', this)">Свернуть</button></h3>
            <div id="chartBody">
                <div class="group-bar">
                    <button class="btn-sub" onclick="setGroup('day', this)">По дням</button>
                    <button class="btn-sub" onclick="setGroup('week', this)">По неделям</button>
                    <button class="btn-sub active" onclick="setGroup('month', this)">По месяцам</button>
                    <button class="btn-sub" onclick="setGroup('quarter', this)">По кварталам</button>
                    <button class="btn-sub" onclick="setGroup('halfyear', this)">Полугодия</button>
                    <button class="btn-sub" onclick="setGroup('year', this)">По годам</button>
                </div>
                <div class="chart-container">
                    <div class="chart-toggles">
                        <div class="chart-toggle-btn active" id="toggleBars" style="background: var(--accent-secondary);" onclick="toggleDataset('bars')"></div>
                        <div class="chart-toggle-btn active" id="toggleLine" style="background: var(--accent-primary);" onclick="toggleDataset('line')"></div>
                    </div>
                    <canvas id="rewardsChart"></canvas>
                </div>
                
                <div class="dates-row" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <div class="date-col"><label>График с:</label><input type="date" id="chartStartDate" onchange="updateChartRange()"></div>
                    <div class="date-col"><label>По:</label><input type="date" id="chartEndDate" onchange="updateChartRange()"></div>
                </div>
            </div>
        </div>

        <div class="card hidden" id="historyCard">
            <h3>📜 История наград <button class="toggle-btn" id="toggleHistBtn" onclick="toggleHistory()">Развернуть</button></h3>
            
            <div class="history-group-bar">
                <button class="btn-sub" onclick="setHistoryGroup('day', this)">По дням</button>
                <button class="btn-sub" onclick="setHistoryGroup('week', this)">По неделям</button>
                <button class="btn-sub" onclick="setHistoryGroup('month', this)">По месяцам</button>
                <button class="btn-sub" onclick="setHistoryGroup('quarter', this)">По кварталам</button>
            </div>

            <div id="history" class="hidden">Ожидание загрузки...</div>
        </div>
    </div>

    <script>
        const API_KEY = "4d0c8ba32dde4a06bda83d52af49120f";
        const DOT_DECIMALS = 10;
        const HEADERS = { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'User-Agent': 'Apidog/1.0.0 (https://apidog.com)' };

        let currentGroup = 'month';
        let currentHistoryGroup = null;
        let rewardsChart = null;
        let allEvents = []; 
        let showBars = true;
        let showLine = true;
        let progressSteps = 0;
        
        let currentTheme = 0; 

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        if (typeof ChartDataLabels !== 'undefined') { Chart.register(ChartDataLabels); }

        function toggleTheme() {
            const logo = document.getElementById('themeLogo');
            if (!logo) return;

            const rect = logo.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            logo.style.opacity = '0';
            triggerFirework(cx, cy);

            currentTheme = (currentTheme + 1) % 3;
            document.body.classList.remove('theme-dark', 'theme-classic');
            if (currentTheme === 1) document.body.classList.add('theme-dark');
            else if (currentTheme === 2) document.body.classList.add('theme-classic');
            if (rewardsChart) setTimeout(() => { updateChartRange(); }, 50);

            setTimeout(() => { logo.style.opacity = '1'; }, 1500);
        }

        function toggleOrientation() {
            const wrapper = document.getElementById('app-wrapper');
            wrapper.classList.toggle('landscape');
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (rewardsChart) { rewardsChart.destroy(); rewardsChart = null; }
                    if (allEvents.length > 0) { updateChartRange(); }
                });
            });
        }

        function toggleCard(bodyId, btn) {
            const body = document.getElementById(bodyId);
            body.classList.toggle('hidden');
            btn.innerText = body.classList.contains('hidden') ? "Развернуть" : "Свернуть";
            if (bodyId === 'chartBody' && !body.classList.contains('hidden')) {
                setTimeout(() => { if (rewardsChart) rewardsChart.resize(); }, 100);
            }
        }

        function toggleHistory() {
            const histDiv = document.getElementById('history');
            histDiv.classList.toggle('hidden');

        async function blinkProgressBar(times) {

        function triggerFirework(cx, cy) {

            flash.className = 'firework-flash';
            flash.style.left = cx + 'px';
            flash.style.top = cy + 'px';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 800);
            
            const colors = ['#E6007A', '#552BBF', '#43AAB4', '#FFFFFF', '#FFD700'];
            
            for(let i=0; i<100; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 200; 
                
                spark.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                spark.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                spark.style.color = colors[Math.floor(Math.random() * colors.length)];
                spark.style.left = cx + 'px';
                spark.style.top = cy + 'px';
                
                const size = 8 + Math.random() * 8;
                spark.style.width = size + 'px';
                spark.style.height = size + 'px';
                
                spark.style.animationDuration = (1.0 + Math.random() * 1.0) + 's';
                
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 2000);
            }

        async function apiFetch(targetUrl, body) {
            try {
                const res = await fetch(targetUrl, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
                const text = await res.text();
                try { return JSON.parse(text); } catch (e) { return { code: -1, message: "Сервер вернул HTML (блокировка?): " + text.substring(0, 100) }; }
            } catch (e) { return { code: -1, message: "Сетевая ошибка: " + e.message }; }
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));
        function formatAmount(amount, decimals) { let d = decimals || 10; return (parseInt(amount || 0) / 10**d).toFixed(4); }
        function formatDate(dateStr) { if (!dateStr) return ""; return new Date(dateStr + "T00:00:00").toLocaleDateString('ru-RU'); }

        async function fetchEvents(baseUrl, addr, chainName, category, maxPages) {
            let events = []; let page = 0;
            while (page < maxPages) {
                progressSteps++;
                const percent = Math.min(95, (progressSteps / 30) * 100);
                showProgressBar(percent);
                const res = await apiFetch(`${baseUrl}/scan/account/reward_slash`, { address: addr, category: category, is_stash: false, row: 100, page: page });
                if (res.code === 0 && res.data && res.data.list && res.data.list.length > 0) {
                    res.data.list.forEach(r => { r.chain = chainName; r.type = category; });
                    events = events.concat(res.data.list);
                    page++; await delay(400); 
                } else { break; }
            }
            return events;
        }

        async function fetchStakingSummary(addr) {

            const relayNomRes = await apiFetch("https://polkadot.api.subscan.io/api/scan/staking/nominator", {address: addr, row: 100, page: 0});
            await delay(300);
            const assetNomRes = await apiFetch("https://assethub-polkadot.api.subscan.io/api/scan/staking/nominator", {address: addr, row: 100, page: 0});
            await delay(300);
            
            const relayAccRes = await apiFetch("https://polkadot.api.subscan.io/api/scan/account", {address: addr});
            await delay(300);
            const assetAccRes = await apiFetch("https://assethub-polkadot.api.subscan.io/api/scan/account", {address: addr});

            if (assetAccRes?.data?.locked) totalLocked += parseInt(assetAccRes.data.locked);

        function renderIncome() {

        }

        function renderHistory() {
            let html = "";
            if (allEvents.length === 0) { html = "Нет наград за этот период."; } 
            else {
                if (currentHistoryGroup) {
                    const groups = {};
                    allEvents.forEach(r => {
                        const key = getGroupKey(r.block_timestamp, currentHistoryGroup);
                        if (!groups[key]) groups[key] = { list: [], total: 0, slash: 0 };
                        groups[key].list.push(r);
                        if (r.type === "Slash") { groups[key].slash += parseInt(r.amount) / 10**DOT_DECIMALS; groups[key].total -= parseInt(r.amount) / 10**DOT_DECIMALS; } 
                        else groups[key].total += parseInt(r.amount) / 10**DOT_DECIMALS;
                    });
                    const sortedKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a));
                    const totalsArray = sortedKeys.map(k => groups[k].total);
                    sortedKeys.forEach((key, index) => {
                        let label = getGroupLabel(key, currentHistoryGroup, true); 
                        let currentTotal = groups[key].total;
                        let diffHTML = "";
                        if (index < sortedKeys.length - 1) {
                            let prevTotal = totalsArray[index + 1];
                            if (prevTotal !== 0) {
                                let diff = currentTotal - prevTotal;
                                if (Math.abs(diff) > 0.0001) {
                                    let pct = (diff / Math.abs(prevTotal)) * 100;
                                    if (diff > 0) diffHTML = `<span class="acc-diff-up">▲ +${diff.toFixed(2)} (+${pct.toFixed(1)}%)</span>`;
                                    else diffHTML = `<span class="acc-diff-down">▼ ${diff.toFixed(2)} (${pct.toFixed(1)}%)</span>`;
                                }
                            }
                        }
                        html += `<div class="acc-group"><div class="acc-header" onclick="toggleAcc(this)"><span>📅 ${label}</span><span><b style="color:green;">+${currentTotal.toFixed(4)} DOT</b> ${diffHTML} <span class="acc-arrow">▶</span></span></div><div class="acc-body hidden">`;
                        groups[key].list.forEach(r => {
                            let date = new Date(r.block_timestamp * 1000).toLocaleString();
                            let amt = formatAmount(r.amount, DOT_DECIMALS);
                            let badgeClass = r.chain === 'Relay' ? 'relay' : 'assethub';
                            let textClass = "color:green;"; let prefix = "+";
                            if (r.type === "Slash") { badgeClass = "slash-badge"; textClass = "color:red;"; prefix = "-"; }
                            let badge = `<span class="badge ${badgeClass}">${r.type === 'Slash' ? 'Slash' : r.chain}</span>`;
                            html += `<div class="reward-item" style="border-bottom:none;">${badge} ${date}<br><b style="${textClass}">${prefix}${amt} DOT</b></div>`;
                        });
                        html += `</div></div>`;
                    });
                } else {
                    allEvents.forEach(r => {
                        let date = new Date(r.block_timestamp * 1000).toLocaleString();
                        let amt = formatAmount(r.amount, DOT_DECIMALS);
                        let badgeClass = r.chain === 'Relay' ? 'relay' : 'assethub';
                        let textClass = "color:green;"; let prefix = "+";
                        if (r.type === "Slash") { badgeClass = "slash-badge"; textClass = "color:red;"; prefix = "-"; }
                        let badge = `<span class="badge ${badgeClass}">${r.type === 'Slash' ? 'Slash' : r.chain}</span>`;
                        html += `<div class="reward-item">${badge} ${date}<br><b style="${textClass}">${prefix}${amt} DOT</b></div>`;
                    });
                }
            }
            document.getElementById('history').innerHTML = html;
        }

        function getGroupKey(timestamp, group) {
            const d = new Date(timestamp * 1000);
            const y = d.getFullYear(); const m = d.getMonth();
            if (group === 'year') return `${y}`;
            if (group === 'month') return `${y}-${String(m+1).padStart(2,'0')}`;
            if (group === 'day') return `${y}-${String(m+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if (group === 'quarter') return `${y}-Q${Math.floor(m / 3) + 1}`;
            if (group === 'halfyear') return `${y}-H${m < 6 ? 1 : 2}`;
            if (group === 'week') { const onejan = new Date(y, 0, 1); const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7); return `${y}-W${String(week).padStart(2,'0')}`; }
            return `${y}-${String(m+1).padStart(2,'0')}`;
        }

        function getGroupLabel(key, group, full = false) {
            const parts = key.split('-');
            if (group === 'month') { if (full) { const m = parseInt(parts[1]); return `${monthNames[m - 1]} ${parts[0]}`; } return `${parts[1]}.${parts[0]}`; }
            if (group === 'day') return `${parts[2]}.${parts[1]}.${parts[0].substring(2)}`;
            if (group === 'quarter') return `${parts[1]} ${parts[0]}`;
            if (group === 'week') return `${parts[1]} ${parts[0]}`;
            if (group === 'halfyear') return `${parts[1]} ${parts[0]}`;
            if (group === 'year') return parts[0];
            return key;
        }

        function getActualDaysInGroup(key, group, timestamps) {
            const now = new Date();
            const currentKey = getGroupKey(Math.floor(now.getTime() / 1000), group);
            if (key < currentKey) {
                if (group === 'day') return 1;
                if (group === 'week') return 7;
                if (group === 'year') { const y = parseInt(key); return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365; }
                if (group === 'month') { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
                if (group === 'quarter') { const [y, qStr] = key.split('Q'); const q = parseInt(qStr); const startMonth = (q - 1) * 3; let days = 0; for (let i = 0; i < 3; i++) days += new Date(parseInt(y), startMonth + i + 1, 0).getDate(); return days; }
                if (group === 'halfyear') { const [y, hStr] = key.split('H'); const h = parseInt(hStr); const startMonth = h === 1 ? 0 : 6; let days = 0; for (let i = 0; i < 6; i++) days += new Date(parseInt(y), startMonth + i + 1, 0).getDate(); return days; }
            }
            if (group === 'day') return 1;
            if (timestamps) { const spanDays = Math.floor((timestamps.last - timestamps.first) / 86400) + 1; if (spanDays > 0) return spanDays; }
            return 1; 
        }

        function renderChart(dataToRender) {
            if (!dataToRender || dataToRender.length === 0) { if (rewardsChart) rewardsChart.destroy(); return; }
            const groupedData = {}; const groupTimestamps = {};
            dataToRender.forEach(r => {
                const key = getGroupKey(r.block_timestamp, currentGroup);
                if (!groupedData[key]) { groupedData[key] = 0; groupTimestamps[key] = { first: r.block_timestamp, last: r.block_timestamp }; }
                groupedData[key] += (r.type === "Slash" ? -1 : 1) * (parseInt(r.amount) / 10**DOT_DECIMALS);
                if (r.block_timestamp < groupTimestamps[key].first) groupTimestamps[key].first = r.block_timestamp;
                if (r.block_timestamp > groupTimestamps[key].last) groupTimestamps[key].last = r.block_timestamp;
            });
            const labels = Object.keys(groupedData).sort();
            const data = labels.map(k => groupedData[k]);
            const displayLabels = labels.map(k => getGroupLabel(k, currentGroup));
            const avgData = labels.map((k, i) => { const days = getActualDaysInGroup(k, currentGroup, groupTimestamps[k]); return data[i] / days; });

            const ctx = document.getElementById('rewardsChart').getContext('2d');
            if (rewardsChart) rewardsChart.destroy();

            const style = getComputedStyle(document.body);
            const barColor = style.getPropertyValue('--bar-color').trim();
            const barBorder = style.getPropertyValue('--bar-border').trim();
            const lineColor = style.getPropertyValue('--line-color').trim();
            const gridColor = style.getPropertyValue('--grid-color').trim();
            const axisText = style.getPropertyValue('--axis-text').trim();

            rewardsChart = new Chart(ctx, {
                data: {
                    labels: displayLabels,
                    datasets: [
                        { type: 'bar', label: 'Чистый доход (DOT)', data: data, backgroundColor: barColor, borderColor: barBorder, borderWidth: 1, borderRadius: 4, yAxisID: 'y', order: 2, hidden: !showBars, datalabels: { display: function(context) { return showBars && (context.dataset.data.length <= 15 || context.dataIndex % Math.ceil(context.dataset.data.length / 15) === 0); }, align: 'top', color: barBorder, font: { weight: 'bold', size: 10 }, formatter: (value) => parseFloat(value.toFixed(2)).toString() } },
                        { type: 'line', label: 'Средний доход в день (DOT)', data: avgData, borderColor: lineColor, backgroundColor: lineColor, tension: 0.3, fill: false, pointRadius: 5, pointHoverRadius: 7, yAxisID: 'y', order: 1, hidden: !showLine, datalabels: { display: function(context) { return showLine && (context.dataset.data.length <= 15 || context.dataIndex % Math.ceil(context.dataset.data.length / 15) === 0); }, align: 'bottom', color: lineColor, font: { weight: 'bold', size: 10 }, formatter: (value) => parseFloat(value.toFixed(2)).toString() } }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, layout: { padding: { top: 30, bottom: 10 } },
                    plugins: { legend: { display: true, position: 'top', labels: { color: axisText, boxWidth: 15, font: { size: 11 } } }, tooltip: { enabled: true } },
                    scales: { y: { beginAtZero: true, ticks: { color: axisText, font: { size: 10 } }, grid: { color: gridColor } }, x: { ticks: { color: axisText, font: { size: 10 } }, grid: { display: false } } }
                }
            });
        }

        window.onload = () => { 
            setPreset(30, document.querySelectorAll('#preset-buttons .btn-sub')[1]); 
            // Включаем змейку вокруг адреса при старте
            document.getElementById('addressCard').classList.add('loading');
        };
    </script>
</body>
</html>
