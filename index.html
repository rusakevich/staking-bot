<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staking Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f0f2f5; margin: 0; color: #333; box-sizing: border-box; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .btn-main { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-main:disabled { background: #99ccdd; }
        .btn-sub { padding: 8px 12px; background: #e9ecef; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; color: #555; margin-right: 5px; margin-bottom: 5px; }
        .btn-sub.active { background: #e6007a; color: white; }
        h3 { margin-top: 0; font-size: 1.1em; color: #555; display: flex; justify-content: space-between; align-items: center; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }
        .reward-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.95em; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.8em; color: white; margin-right: 5px; }
        .relay { background: #e6007a; } 
        .assethub { background: #6d3aff; } 
        .muted { color: #999; font-size: 0.9em; }
        .hidden { display: none; }
        .income-box { text-align: center; padding: 10px 0; }
        .income-val { font-size: 2em; font-weight: bold; color: #0088cc; }
        .group-bar { display: flex; flex-wrap: wrap; margin-top: 10px; }
        .chart-container { height: 350px; margin-top: 15px; }
        .error { color: red; font-size: 0.9em; margin-top: 10px; text-align: center; }
        .period-label { text-align: center; font-weight: bold; color: #0088cc; margin: 10px 0; font-size: 1.1em; }
        .progress-label { text-align: center; color: #e6007a; font-weight: bold; margin-top: 5px; min-height: 20px; }
        .val-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9em; }
        .val-status { padding: 2px 6px; border-radius: 4px; font-size: 0.8em; color: white; margin-right: 5px; }
        .active { background: #28a745; }
        .waiting { background: #ffc107; color: #333; }
        .toggle-btn { background: #e9ecef; color: #555; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; cursor: pointer; font-weight: bold; }
        
        /* Плавающая кнопка поворота экрана */
        .rotate-btn {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            background: rgba(108, 117, 125, 0.9);
            color: white;
            border-radius: 50%;
            z-index: 9999;
            font-size: 20px;
            padding: 0;
            text-align: center;
            line-height: 45px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
        }

        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            .rotate-btn { display: block; }
            h3 { font-size: 1em; flex-direction: column; align-items: flex-start; gap: 5px; }
            .chart-container { height: 300px; }
            .btn-sub { flex: 1 1 45%; text-align: center; padding: 8px 5px; } /* Кнопки по 2 в ряд */
            .row { flex-direction: column; gap: 5px; } /* Календарь в столбик */
        }

        /* Горизонтальный режим с правильной прокруткой */
        body.force-landscape {
            transform: rotate(90deg);
            transform-origin: bottom left;
            width: 100vh;
            height: 100vw;
            position: fixed;
            top: -100vw;
            left: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; /* Плавная прокрутка на iOS */
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <button class="rotate-btn" id="rotateBtn" onclick="toggleOrientation()">🔄</button>

    <div class="card">
        <h3>Адрес Polkadot</h3>
        <input type="text" id="address" placeholder="Вставьте ваш адрес (Polkadot / Asset Hub)">
        <button class="btn-main" onclick="fetchData()">Загрузить данные</button>
        <div id="mainError" class="error"></div>
    </div>

    <div class="card hidden" id="configCard">
        <h3>📅 Период анализа</h3>
        <div class="row">
            <div class="col"><label>С</label><input type="date" id="startDate" onchange="onDateChange()"></div>
            <div class="col"><label>По</label><input type="date" id="endDate" onchange="onDateChange()"></div>
        </div>
        <div style="display: flex; flex-wrap: wrap; margin-bottom:10px;">
            <button class="btn-sub" onclick="setPreset(7, this)">7 дней</button>
            <button class="btn-sub active" onclick="setPreset(30, this)">30 дней</button>
            <button class="btn-sub" onclick="setPreset(90, this)">90 дней</button>
            <button class="btn-sub" onclick="setPreset(180, this)">Полгода</button>
            <button class="btn-sub" onclick="setPreset(365, this)">Год</button>
            <button class="btn-sub" onclick="setPreset(99999, this)">Весь период</button>
        </div>
        <div class="period-label" id="periodLabel"></div>
        <div class="progress-label" id="progressLabel"></div>
        <button class="btn-main" style="background:#e6007a;" onclick="fetchData()">Рассчитать</button>
    </div>

    <div class="card hidden" id="incomeCard">
        <h3>💎 Доход от стейкинга</h3>
        <div id="income">Загрузка...</div>
    </div>

    <div class="card hidden" id="chartCard">
        <h3>📊 График доходов</h3>
        <div class="group-bar">
            <button class="btn-sub" onclick="setGroup('day', this)">По дням</button>
            <button class="btn-sub" onclick="setGroup('week', this)">По неделям</button>
            <button class="btn-sub active" onclick="setGroup('month', this)">По месяцам</button>
            <button class="btn-sub" onclick="setGroup('quarter', this)">По кварталам</button>
            <button class="btn-sub" onclick="setGroup('halfyear', this)">Полугодия</button>
            <button class="btn-sub" onclick="setGroup('year', this)">По годам</button>
        </div>
        <div class="chart-container"><canvas id="rewardsChart"></canvas></div>
    </div>

    <div class="card hidden" id="historyCard">
        <h3>📜 История наград <button class="toggle-btn" id="toggleHistBtn" onclick="toggleHistory()">Развернуть</button></h3>
        <div id="history" class="hidden">Ожидание загрузки...</div>
    </div>

    <div class="card hidden" id="validatorsCard">
        <h3>🧱 Валидаторы</h3>
        <div id="validators">Ожидание загрузки валидаторов...</div>
    </div>

    <script>
        const API_KEY = "4d0c8ba32dde4a06bda83d52af49120f";
        const DOT_DECIMALS = 10;
        const HEADERS = { 
            'Content-Type': 'application/json', 
            'x-api-key': API_KEY,
            'User-Agent': 'Apidog/1.0.0 (https://apidog.com)' 
        };

        let currentGroup = 'month';
        let rewardsChart = null;
        let allRewards = [];

        if (typeof ChartDataLabels !== 'undefined') {
            Chart.register(ChartDataLabels);
        }

        function toggleOrientation() {
            document.body.classList.toggle('force-landscape');
            setTimeout(() => { if (rewardsChart) rewardsChart.resize(); }, 300);
        }

        function toggleHistory() {
            const histDiv = document.getElementById('history');
            histDiv.classList.toggle('hidden');
            document.getElementById('toggleHistBtn').innerText = histDiv.classList.contains('hidden') ? "Развернуть" : "Свернуть";
        }

        function showProgress(text) {
            document.getElementById('progressLabel').innerText = text;
        }

        function showError(text) {
            document.getElementById('mainError').innerText = text;
        }

        async function apiFetch(targetUrl, body) {
            try {
                const res = await fetch(targetUrl, { method: 'POST', headers: HEADERS, body: JSON.stringify(body) });
                const text = await res.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    return { code: -1, message: "Сервер вернул HTML (блокировка?): " + text.substring(0, 100) };
                }
            } catch (e) {
                return { code: -1, message: "Сетевая ошибка: " + e.message };
            }
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function formatAmount(amount, decimals) {
            let d = decimals || 10;
            return (parseInt(amount || 0) / 10**d).toFixed(4);
        }

        function formatDate(dateStr) {
            if (!dateStr) return "";
            return new Date(dateStr + "T00:00:00").toLocaleDateString('ru-RU');
        }

        function updatePeriodLabel() {
            document.getElementById('periodLabel').innerText = `Текущий период: С ${formatDate(document.getElementById('startDate').value)} По ${formatDate(document.getElementById('endDate').value)}`;
        }

        function onDateChange() {
            document.querySelectorAll('#configCard .btn-sub').forEach(b => b.classList.remove('active'));
            updatePeriodLabel();
        }

        function setPreset(days, btn) {
            const end = new Date(); const start = new Date();
            if (days === 99999) { start.setFullYear(2020, 7, 19); } else { start.setDate(end.getDate() - days); }
            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = end.toISOString().split('T')[0];
            document.querySelectorAll('#configCard .btn-sub').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            updatePeriodLabel();
        }

        function setGroup(group, btn) {
            currentGroup = group;
            document.querySelectorAll('#chartCard .btn-sub').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (allRewards.length > 0) renderChart();
        }

        async function fetchRewards(baseUrl, addr, chainName) {
            let rewards = []; let page = 0; let lastError = null;
            while (page < 10) {
                showProgress(`Загрузка ${chainName}: стр. ${page + 1}...`);
                const res = await apiFetch(`${baseUrl}/scan/account/reward_slash`, { address: addr, category: "Reward", is_stash: false, row: 100, page: page });
                if (res.code === 0 && res.data && res.data.list && res.data.list.length > 0) {
                    res.data.list.forEach(r => { r.chain = chainName; });
                    rewards = rewards.concat(res.data.list);
                    page++; await delay(500); 
                } else {
                    if (res.code !== 0) lastError = res.message;
                    break; 
                }
            }
            return { list: rewards, error: lastError };
        }

        async function fetchData() {
            try {
                showError(""); 
                const addr = document.getElementById('address').value.trim();
                if (!addr) { showError("Введите адрес!"); return; }
                
                const startStr = document.getElementById('startDate').value;
                const endStr = document.getElementById('endDate').value;
                if (!startStr || !endStr) { showError("Выберите даты!"); return; }
                updatePeriodLabel();
                
                const fromTs = Math.floor(new Date(startStr + "T00:00:00").getTime() / 1000);
                const toTs = Math.floor(new Date(endStr + "T23:59:59").getTime() / 1000);
                
                document.querySelectorAll('.card').forEach(c => c.classList.remove('hidden'));
                document.getElementById('income').innerText = "Расчет дохода...";
                document.getElementById('history').innerText = "Ожидание загрузки...";
                document.getElementById('validators').innerText = "Ожидание загрузки...";
                
                const btn = document.querySelector('#configCard .btn-main');
                btn.disabled = true; btn.innerText = "Идет загрузка...";

                const assetRes = await fetchRewards("https://assethub-polkadot.api.subscan.io/api", addr, "Asset Hub");
                const relayRes = await fetchRewards("https://polkadot.api.subscan.io/api", addr, "Relay Chain");
                
                let rewards = [...assetRes.list, ...relayRes.list];
                let errors = [];
                if (assetRes.error) errors.push("Asset Hub: " + assetRes.error);
                if (relayRes.error) errors.push("Relay: " + relayRes.error);

                if (rewards.length === 0) {
                    let errMsg = "Награды не найдены. ";
                    if (errors.length > 0) {
                        errMsg += "Причина: " + errors.join(" | ");
                    } else {
                        errMsg += "Возможно, за выбранный период выплат не было. Попробуйте нажать 'Весь период'.";
                    }
                    document.getElementById('history').innerHTML = `<span class="error">${errMsg}</span>`;
                    document.getElementById('income').innerText = "Нет данных";
                } else {
                    allRewards = rewards.filter(r => r.block_timestamp >= fromTs && r.block_timestamp <= toTs);
                    if (allRewards.length === 0) {
                        document.getElementById('history').innerHTML = `<span class="error">За этот период (${formatDate(startStr)} - ${formatDate(endStr)}) выплат не найдено. Найдено ${rewards.length} выплат вне этого периода. Нажмите 'Весь период'.</span>`;
                        document.getElementById('income').innerText = "Нет данных за период";
                    } else {
                        allRewards.sort((a, b) => b.block_timestamp - a.block_timestamp);
                        renderIncome();
                        renderHistory();
                        renderChart();
                    }
                }

                await fetchValidators(addr);
                
                btn.disabled = false; btn.innerText = "Рассчитать";
                showProgress("Готово!");
            } catch (err) {
                console.error(err);
                showProgress("Ошибка");
                showError("Критическая ошибка: " + err.message);
            }
        }

        async function fetchValidators(addr) {
            showProgress("Шаг 3: Загрузка валидаторов...");
            
            // Добавлены параметры row и page, без них API не возвращает список номинаций
            const relayNomRes = await apiFetch("https://polkadot.api.subscan.io/api/scan/staking/nominator", {address: addr, row: 100, page: 0});
            await delay(500);
            const assetNomRes = await apiFetch("https://assethub-polkadot.api.subscan.io/api/scan/staking/nominator", {address: addr, row: 100, page: 0});
            await delay(500);
            
            let nominations = [];
            
            // Ищем в стандартном месте
            if (relayNomRes?.data?.staking_info?.nominations) nominations = nominations.concat(relayNomRes.data.staking_info.nominations);
            if (assetNomRes?.data?.staking_info?.nominations) nominations = nominations.concat(assetNomRes.data.staking_info.nominations);
            
            // Ищем в корневом месте (на случай изменения API)
            if (relayNomRes?.data?.nominations) nominations = nominations.concat(relayNomRes.data.nominations);
            if (assetNomRes?.data?.nominations) nominations = nominations.concat(assetNomRes.data.nominations);

            if (nominations.length > 0 && typeof nominations[0] === 'object') {
                nominations = nominations.map(n => n.target || n.stash || n.address).filter(Boolean);
            }

            if (nominations.length === 0) {
                let debugHTML = "<i>Список номинаций пуст.</i><br><br>";
                debugHTML += `<div class="muted">Relay Response: <br><code style="word-break:break-all;">${JSON.stringify(relayNomRes.data || relayNomRes.message)}</code></div><br>`;
                debugHTML += `<div class="muted">Asset Hub Response: <br><code style="word-break:break-all;">${JSON.stringify(assetNomRes.data || assetNomRes.message)}</code></div>`;
                document.getElementById('validators').innerHTML = debugHTML;
                return;
            }

            let valHTML = `<div class="muted" style="margin-bottom:10px;">Всего номинировано: ${nominations.length}. Проверяем статус...</div>`;
            document.getElementById('validators').innerHTML = valHTML;

            for (let i = 0; i < nominations.length; i++) {
                showProgress(`Проверка валидатора ${i + 1} из ${nominations.length}...`);
                const valAddr = nominations[i];
                const valRes = await apiFetch("https://polkadot.api.subscan.io/api/scan/staking/validator", {stash: valAddr});
                await delay(1000); 

                if (valRes.code === 0 && valRes.data && valRes.data.info) {
                    const info = valRes.data.info;
                    const statusClass = info.status === "Elected" ? "active" : "waiting";
                    const statusText = info.status === "Elected" ? "Активен (Стейкает)" : "Ожидает (Не стейкает)";
                    const commission = (parseInt(info.validator_prefs_value || 0) / 10000000).toFixed(2);
                    const bondedTotal = formatAmount(info.bonded_total, DOT_DECIMALS);
                    
                    valHTML += `
                        <div class="val-item">
                            <span class="val-status ${statusClass}">${statusText}</span><br>
                            <b>Адрес:</b> <span style="font-family:monospace; font-size:0.9em;">${valAddr}</span><br>
                            <b>Комиссия:</b> ${commission}% | <b>Всего bonded:</b> ${bondedTotal} DOT | <b>Номинаторов:</b> ${info.count_nominators || 0}
                        </div>
                    `;
                    document.getElementById('validators').innerHTML = valHTML;
                }
            }
        }

        function renderIncome() {
            let totalIncome = 0;
            allRewards.forEach(r => totalIncome += parseInt(r.amount));
            document.getElementById('income').innerHTML = `
                <div class="income-box">
                    <div class="income-val">+${(totalIncome / 10**DOT_DECIMALS).toFixed(4)} DOT</div>
                    <div class="muted">из ${allRewards.length} выплат</div>
                </div>
            `;
        }

        function renderHistory() {
            let html = "";
            if (allRewards.length === 0) { html = "Нет наград за этот период."; } 
            else {
                allRewards.forEach(r => {
                    let date = new Date(r.block_timestamp * 1000).toLocaleString();
                    let amt = formatAmount(r.amount, DOT_DECIMALS);
                    let badge = `<span class="badge ${r.chain === 'Relay' ? 'relay' : 'assethub'}">${r.chain}</span>`;
                    html += `<div class="reward-item">${badge} ${date}<br><b style="color:green;">+${amt} DOT</b></div>`;
                });
            }
            document.getElementById('history').innerHTML = html;
        }

        function getGroupKey(timestamp, group) {
            const d = new Date(timestamp * 1000);
            const y = d.getFullYear(); const m = d.getMonth();
            if (group === 'year') return `${y}`;
            if (group === 'month') return `${y}-${String(m+1).padStart(2,'0')}`;
            if (group === 'day') return `${y}-${String(m+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            if (group === 'quarter') return `${y}-Q${Math.floor(m / 3) + 1}`;
            if (group === 'halfyear') return `${y}-H${m < 6 ? 1 : 2}`;
            if (group === 'week') {
                const onejan = new Date(y, 0, 1);
                const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
                return `${y}-W${String(week).padStart(2,'0')}`;
            }
            return `${y}-${String(m+1).padStart(2,'0')}`;
        }

        function getGroupLabel(key, group) {
            const parts = key.split('-');
            if (group === 'month') return `${parts[1]}.${parts[0]}`;
            if (group === 'day') return `${parts[2]}.${parts[1]}.${parts[0].substring(2)}`;
            return key;
        }

        function getActualDaysInGroup(key, group, timestamps) {
            const now = new Date();
            const currentKey = getGroupKey(Math.floor(now.getTime() / 1000), group);
            
            if (key < currentKey) {
                if (group === 'day') return 1;
                if (group === 'week') return 7;
                if (group === 'year') {
                    const y = parseInt(key);
                    return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
                }
                if (group === 'month') {
                    const [y, m] = key.split('-').map(Number);
                    return new Date(y, m, 0).getDate();
                }
                if (group === 'quarter') {
                    const [y, qStr] = key.split('Q'); const q = parseInt(qStr);
                    const startMonth = (q - 1) * 3; let days = 0;
                    for (let i = 0; i < 3; i++) days += new Date(parseInt(y), startMonth + i + 1, 0).getDate();
                    return days;
                }
                if (group === 'halfyear') {
                    const [y, hStr] = key.split('H'); const h = parseInt(hStr);
                    const startMonth = h === 1 ? 0 : 6; let days = 0;
                    for (let i = 0; i < 6; i++) days += new Date(parseInt(y), startMonth + i + 1, 0).getDate();
                    return days;
                }
            }
            
            if (group === 'day') return 1;
            if (timestamps) {
                const spanDays = Math.floor((timestamps.last - timestamps.first) / 86400) + 1;
                if (spanDays > 0) return spanDays;
            }
            return 1; 
        }

        function renderChart() {
            const groupedData = {};
            const groupTimestamps = {};
            
            allRewards.forEach(r => {
                const key = getGroupKey(r.block_timestamp, currentGroup);
                if (!groupedData[key]) {
                    groupedData[key] = 0;
                    groupTimestamps[key] = { first: r.block_timestamp, last: r.block_timestamp };
                }
                groupedData[key] += parseInt(r.amount) / 10**DOT_DECIMALS;
                if (r.block_timestamp < groupTimestamps[key].first) groupTimestamps[key].first = r.block_timestamp;
                if (r.block_timestamp > groupTimestamps[key].last) groupTimestamps[key].last = r.block_timestamp;
            });

            const labels = Object.keys(groupedData).sort();
            const data = labels.map(k => groupedData[k]);
            const displayLabels = labels.map(k => getGroupLabel(k, currentGroup));

            const avgData = labels.map((k, i) => {
                const days = getActualDaysInGroup(k, currentGroup, groupTimestamps[k]);
                return data[i] / days;
            });

            const ctx = document.getElementById('rewardsChart').getContext('2d');
            if (rewardsChart) rewardsChart.destroy();

            rewardsChart = new Chart(ctx, {
                data: {
                    labels: displayLabels,
                    datasets: [
                        {
                            type: 'bar', label: 'Доход (DOT)', data: data,
                            backgroundColor: 'rgba(0, 136, 204, 0.6)', borderColor: '#0088cc',
                            borderWidth: 1, borderRadius: 4, yAxisID: 'y', order: 2,
                            datalabels: {
                                display: true,
                                align: 'top',
                                color: '#0088cc',
                                font: { weight: 'bold', size: 10 },
                                formatter: (value) => parseFloat(value.toFixed(2)).toString()
                            }
                        },
                        {
                            type: 'line', label: 'Средний доход в день (DOT)', data: avgData,
                            borderColor: '#e6007a', backgroundColor: '#e6007a',
                            tension: 0.3, fill: false, pointRadius: 5, pointHoverRadius: 7,
                            yAxisID: 'y', order: 1,
                            datalabels: {
                                display: true,
                                align: 'bottom',
                                color: '#e6007a',
                                font: { weight: 'bold', size: 10 },
                                formatter: (value) => parseFloat(value.toFixed(2)).toString()
                            }
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, layout: { padding: { top: 30 } },
                    plugins: {
